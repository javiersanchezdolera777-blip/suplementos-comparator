name: Publicador Automático de Chollos en Telegram

on:
  # 1. Programado para ejecutarse a las 10:00, 15:00 y 20:00 (Hora UTC)
  schedule:
    - cron: '0 10,15,20 * * *'
  
  # 2. Permitir ejecución manual desde la pestaña "Actions" en GitHub
  workflow_dispatch:

jobs:
  publish-deals:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary requests python-dotenv

      - name: Ejecutar script de Telegram
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python backend/send_telegram_deals.py
